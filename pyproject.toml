[project]
name = "algotradeplan"
version = "0.1.0"
description = "Production-ready AlgoTrade skeleton"
requires-python = ">=3.11"

[project.scripts]
algotradeplan = "algotradeplan.cli:main"

[project.optional-dependencies]
data = ["pandas>=2.2", "scikit-learn>=1.5", "ccxt>=4.5.54"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[tool.ruff]
line-length = 100

[tool.interrogate]
ignore-init-method = true
ignore-module = true
fail-under = 70
